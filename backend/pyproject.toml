[project]
name = "zak2-api"
version = "0.1.0"
description = "zak2 FastAPI backend — A 股量化终端 Web API（P1：登录 + 选股）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "apscheduler>=3.11.3",
    "mcp>=2.0.0",
    "tickflow[all]>=0.1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
backtest = [
    "vnpy>=3.9.0,<5",
    "vnpy-ctastrategy>=1.3.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "vnpy: requires optional backtest extras (vnpy / vnpy-ctastrategy)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ"]
# 行长度交给 formatter 处理（长 SQL / 长 docstring / 测试数据字面量不强制拆行）
ignore = ["E501", "DTZ001", "DTZ007"]
# B008：FastAPI 依赖注入惯用法 Depends(...) 作为参数默认值（官方推荐）
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# 第三方库（vnpy / tickflow / mcp 等）缺 stub，暂忽略缺失导入
ignore_missing_imports = true
# 渐进式：检查未标注函数体，但不强制每个函数都写标注
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
# 收紧：所有函数必须有类型标注，返回 Any 需显式处理
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["alembic/", "scripts/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
