# zak2：api + web + quote-collector；PG/Redis 用宿主机 zak（host.docker.internal）
# 用法：docker compose up --build
# Web: http://127.0.0.1:8080  API: http://127.0.0.1:8000

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 覆盖本机 localhost：容器内访问宿主机服务
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://zak:zak@host.docker.internal:5432/zak}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://host.docker.internal:6379/0}
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  quote-collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://zak:zak@host.docker.internal:5432/zak}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://host.docker.internal:6379/0}
    command: ["python", "-m", "app.quote_collector"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
